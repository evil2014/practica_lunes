services:
  frontend:
    image: nginx:latest
    container_name: frontend_nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - red_app

  backend:
    build: ./backend
    container_name: backend_node
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: escuela
      DB_USER: admin
      DB_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - red_app

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: escuela
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d escuela"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - red_app

volumes:
  datos_postgres:

networks:
  red_app:
    driver: bridge
